<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Çoklu Dil · 1. gönderi (nizami)</title>
<style>
@font-face{font-family:Manrope;src:url(manrope-var-latin.woff2) format('woff2');font-weight:200 800;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Manrope;src:url(manrope-var-latin-ext.woff2) format('woff2');font-weight:200 800;unicode-range:U+0100-02AF,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
/* Boşluk birimi 8 px; tüm aralıklar 8'in katı. Tip ölçeği: 28 / 52 / 108. */
:root{--u:8px;--yesil:#0D2B22;--altin:#C9A84C;--krem:#EADFC1;--ink:#7F6419;--m:96px;--zone:104px}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1440px;background:var(--krem);font-family:Manrope,sans-serif;color:var(--yesil);overflow:hidden}
/* 3 bölge: başlık şeridi · içerik · alt şerit; üst ve alt kenar boşluğu eşit (104) */
.head{position:absolute;top:var(--zone);left:0;right:0;text-align:center;font-weight:800;font-size:30px;letter-spacing:.5em;padding-left:.5em;line-height:1;color:var(--ink)}
.foot{position:absolute;bottom:var(--zone);left:0;right:0;display:flex;justify-content:center;gap:calc(2*var(--u))}
.foot span{font-weight:800;font-size:28px;letter-spacing:.08em;line-height:1;border:3px solid var(--yesil);border-radius:99px;padding:calc(1.5*var(--u)) calc(4*var(--u))}
.body{transform:translateY(-8px);position:absolute;left:var(--m);right:var(--m);top:calc(var(--zone) + 30px);bottom:calc(var(--zone) + 64px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.q{font-weight:800;letter-spacing:-.035em;line-height:1.1}
.q span,.s span{display:block;white-space:nowrap}
.rule{width:624px;height:4px;margin:75px 0 50px;background:linear-gradient(90deg,transparent,var(--altin) 18%,var(--altin) 82%,transparent)}
.s{font-weight:500;line-height:1.32;letter-spacing:-.01em;color:#0D2B22d9}
.s b{font-weight:800;color:var(--ink)}
</style></head><body>
<div class="head">QRMENUOFFICIAL</div>
<div class="body">
 <div class="q" id="Q"><span>Personeliniz</span><span>Menüyü Kaç Dilde</span><span>Anlatabiliyor?</span></div>
 <div class="rule"></div>
 <div class="s" id="S"><span>Turist müşteri</span><span>menüyü kendi dilinde <b>okusun,</b></span><span>siparişini kendi dilinde <b>versin.</b></span></div>
</div>
<div class="foot"><span>TR</span><span>EN</span><span>DE</span><span>FR</span></div>
<script>
document.fonts.ready.then(()=>{const W=888;
 for(const [id,max,min] of [['Q',112,80],['S',56,44]]){const e=document.getElementById(id);let f=max;
  const w=()=>Math.max(...[...e.children].map(c=>{const r=document.createRange();r.selectNodeContents(c);return r.getBoundingClientRect().width}));
  e.style.fontSize=f+'px';while(w()>W&&f>min){f-=1;e.style.fontSize=f+'px'}
  document.body.dataset['f'+id]=f+'|'+Math.round(w());}
 document.body.dataset.ready=1;});
</script></body></html>
