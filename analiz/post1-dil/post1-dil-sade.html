<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Çoklu Dil · 1. gönderi (sade, Işık)</title>
<style>
@font-face{font-family:Manrope;src:url(manrope-var-latin.woff2) format('woff2');font-weight:200 800;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Manrope;src:url(manrope-var-latin-ext.woff2) format('woff2');font-weight:200 800;unicode-range:U+0100-02AF,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{--yesil:#0D2B22;--altin:#C9A84C;--krem:#EADFC1;--ink:#7F6419}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1440px;background:var(--krem);font-family:Manrope,sans-serif;color:var(--yesil);overflow:hidden}
.brand{position:absolute;top:104px;left:0;right:0;text-align:center;font-weight:800;font-size:30px;letter-spacing:.5em;padding-left:.5em;color:var(--ink)}
.blok{position:absolute;left:96px;right:96px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.q{font-weight:800;letter-spacing:-.035em;line-height:1.1}
.q span,.s span{display:block;white-space:nowrap}
.rule{width:620px;height:4px;margin:64px 0 60px;background:linear-gradient(90deg,transparent,var(--altin) 18%,var(--altin) 82%,transparent)}
.s{font-weight:500;line-height:1.3;letter-spacing:-.01em;color:#0D2B22d9}
.s b{font-weight:800;color:var(--ink)}
</style></head><body>
<div class="brand">QRMENUOFFICIAL</div>
<div class="blok">
 <div class="q" id="Q"><span>Personeliniz</span><span>Menüyü Kaç Dilde</span><span>Anlatabiliyor?</span></div>
 <div class="rule"></div>
 <div class="s" id="S"><span>Turist müşteri menüyü</span><span>kendi dilinde <b>okusun,</b></span><span style="margin-top:22px">siparişini</span><span>kendi dilinde <b>versin.</b></span></div>
</div>
<script>
document.fonts.ready.then(()=>{const W=888;
 for(const [id,max,min] of [['Q',112,80],['S',58,44]]){const e=document.getElementById(id);let f=max;
  const w=()=>Math.max(...[...e.children].map(c=>{const r=document.createRange();r.selectNodeContents(c);return r.getBoundingClientRect().width}));
  e.style.fontSize=f+'px';while(w()>W&&f>min){f-=1;e.style.fontSize=f+'px'}
  document.body.dataset['f'+id]=f+'|'+Math.round(w());}
 document.body.dataset.ready=1;});
</script></body></html>
