<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Yönetim Paneli | QR Menu Official</title>
<link rel="icon" type="image/svg+xml" href="../assets/brand/favicon.svg">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login__card" autocomplete="on">
    <img class="login__logo" src="../assets/brand/qr-menu-official-logo-v4-compact.svg" alt="QR Menu Official" width="120" height="40">
    <h1>Yönetim Paneli</h1>
    <label>Kullanıcı adı<input name="username" type="text" autocomplete="username" required maxlength="64"></label>
    <label>Parola<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
    <p class="login__err" id="login-err" role="alert" hidden></p>
    <button class="btn btn--primary" type="submit">Giriş yap</button>
  </form>
</div>
<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <div class="side__brand"><img src="../assets/brand/qr-menu-official-logo-v4-compact-white.svg" alt="QR Menu Official" width="110" height="36"></div>
    <nav class="side__nav" id="nav" aria-label="Panel menüsü"></nav>
    <div class="side__foot"><span id="who"></span><button class="btn btn--ghost btn--sm" id="logout" type="button">Çıkış</button></div>
  </aside>
  <div class="main">
    <header class="top"><button class="top__menu btn btn--ghost" id="menu-btn" type="button" aria-label="Menüyü aç" aria-expanded="false">Menü</button><h1 id="title" class="top__title"></h1><div id="actions" class="top__actions"></div></header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dlg" class="dlg"></dialog>
<script src="admin.js"></script>
</body>
</html>
