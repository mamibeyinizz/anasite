<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07110e">
  <title>Yönetim paneli — QR Menu Official</title>
  <link rel="stylesheet" href="yonetim.css">
</head>
<body>
  <a class="skip" href="#icerik">İçeriğe geç</a>
  <main id="icerik">
    <header class="top">
      <img class="logo" src="../../assets/brand/qr-menu-official-logo-compact.svg" width="172" height="50" alt="QR Menu Official">
      <p class="kicker">Prototip</p>
      <h1>Yönetim paneli</h1>
      <p class="lede">Restoran ekranlarının bağımsız dosyası bu depoda yok. Aşağıdaki başlıklar tanıtım sayfalarındaki temsili çizimlerdir ve örnek veri kullanır. Kayıt oluşturmaz, sipariş taşımaz.</p>
      <p class="actions"><a class="btn" href="../../lisans/">Lisans yönetimini aç</a></p>
    </header>
    <section aria-labelledby="cizim-baslik">
      <h2 id="cizim-baslik">Örnek veri çizimleri</h2>
      <p id="cizim-durum" class="status">Çizim listesi hazırlanıyor.</p>
      <div id="cizim-liste"></div>
    </section>
  </main>
  <script src="../../moduller/module-data.js"></script>
  <script src="yonetim.js"></script>
</body>
</html>
